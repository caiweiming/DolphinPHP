<script type="text/html" id="{$id|default=''}">
    <input type="checkbox"
           name="{$field|default=''}"
           title="{$options|default=''}"
           value="{{= d.{$field} }}"
           {{= d.{$field} == 1 ? 'checked': ''}}
           lay-skin="switch" lay-filter="{$id|default=''}">
</script>
<script>
    layui.use(['form', 'table'], function () {
        const form = layui.form;
        const table = layui.table;
        form.on('switch({$id|default=""})', function (obj) {
            const tableId = '{$tableId|default=""}';
            const field = "{$field|default=''}";
            const value = obj.elem.checked ? 1 : 0;
            const index = $(obj.elem).closest('tr').data('index');
            const data = table.cache[tableId][index] || {};
            const id = data['dp_pk'];

            Dolphin.loading('处理中...');

            // 提交更新请求
            $.ajax({
                url: DolphinConfig.url.quickEdit,
                type: 'POST',
                data: {
                    id: id,
                    field: field,
                    value: value,
                    _t: '{$crudToken|default=""}'
                },
                dataType: 'json',
                success: function (res) {
                    Dolphin.loading('hide')

                    if (res.code !== 1) {
                        Dolphin.error(res.msg || '修改失败');
                        $(obj.elem).prop('checked', !obj.elem.checked);
                        form.render('checkbox');
                    }
                },
                error: function (xhr, status, error) {
                    Dolphin.loading('hide');
                    Dolphin.error('网络错误，修改失败');
                    $(obj.elem).prop('checked', !obj.elem.checked);
                    form.render('checkbox');
                }
            });
        });
    });
</script>
