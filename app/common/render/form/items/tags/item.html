<div class="mb-3 {$inner_width|default=''}" id="{$_form_id|default='dp'}-{$id|default=''}" data-component="tags">
    <label for="{$id|default=''}" class="form-label {$required ?= 'required'}">{$label|default=''|raw}
        {notempty name="help"}
        <span class="form-help" data-bs-toggle="popover" data-bs-placement="top" data-bs-html="true" data-bs-content="{$help|raw}">?</span>
        {/notempty}
    </label>
    <div class="input-{$icon ? 'icon' : 'group'} {$group_class|default=''}">
        <input type="text"
               class="form-control {$rounded ?= ' form-control-rounded'} {$flush ?= ' form-control-flush'} {$size|default=''} {$class|default=''}"
               name="{$name|default=''}"
               id="{$id|default=''}"
               value="{$value|default=''}"
               autocomplete="off"
               placeholder="{$placeholder !== null ? $placeholder : '请输入'.(isset($label) ? strip_tags($label) : '')}"
               data-options="{$options|default=''|raw}"
               {$props|default=''|raw}>
    </div>

    {notempty name="tips"}
    <small class="form-hint">{$tips|raw}</small>
    {/notempty}
</div>
